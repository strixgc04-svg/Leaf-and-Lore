<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute; inset:0; overflow:hidden; background:{{ tint }}; container-type:size;">
  <div style="position:absolute; inset:0; background-image:repeating-linear-gradient(135deg, rgba(36,51,44,0.045) 0 1px, transparent 1px 10px);"></div>
  <sc-if value="{{ hasFloor }}" hint-placeholder-val="{{ false }}"><div style="position:absolute; left:0; right:0; bottom:0; height:30%; background:rgba(36,51,44,0.04);"></div></sc-if>
  <div style="position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; gap:3.5%; padding-bottom:24%;">
    <sc-for list="{{ shapes }}" as="s" hint-placeholder-count="0">
      <div style="position:relative; flex:none; width:{{ s.w }}; height:{{ s.h }}; border-radius:{{ s.r }}; background-color:{{ s.fill }}; background-image:linear-gradient(100deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 38%, rgba(0,0,0,0.08)); box-shadow:0 1.4cqh 3.2cqh -1.4cqh rgba(36,51,44,0.45); display:flex; align-items:center; justify-content:center; color:{{ s.ink }};">
        <sc-if value="{{ s.showLabel }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; align-items:center; gap:0.9cqh; text-align:center; padding:0 10%;">
            <div style="font-size:max(4px, 1.3cqh); letter-spacing:0.3em; opacity:0.75; white-space:nowrap;">LEAF &amp; LORE</div>
            <div style="width:2.4cqh; height:1px; background:currentColor; opacity:0.45;"></div>
            <div style="font-size:max(5px, 2.1cqh); letter-spacing:0.1em; text-transform:uppercase; line-height:1.25; font-weight:500;">{{ s.label }}</div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ isVideo }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
      <div style="width:max(28px, 14cqw); height:max(28px, 14cqw); border-radius:50%; background:rgba(252,251,247,0.9); display:flex; align-items:center; justify-content:center; color:#24332C;"><i class="ph-fill ph-play" style="font-size:max(11px, 5cqw); margin-left:6%;"></i></div>
    </div>
  </sc-if>
  <sc-if value="{{ hasCaption }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; left:10px; bottom:9px; right:10px; font-family:'JetBrains Mono', ui-monospace, monospace; font-size:9.5px; line-height:1.3; letter-spacing:0.02em; text-transform:uppercase; color:{{ capColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ caption }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;media&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;mini&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;noPlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.media || {};
    const mini = !!this.props.mini;
    const shapes = m.shapes || [];
    return {
      tint: m.tint || '#EEE9DF',
      shapes: shapes.map(s => ({ ...s, showLabel: !mini })),
      hasFloor: !m.dark && shapes.length > 0,
      isVideo: !!m.video && !this.props.noPlay,
      hasCaption: !mini && !!m.caption,
      caption: m.caption || '',
      capColor: m.dark ? 'rgba(252,251,247,0.6)' : 'rgba(36,51,44,0.5)'
    };
  }
}
</script>
</body>
</html>
